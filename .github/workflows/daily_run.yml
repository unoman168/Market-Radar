name: Market Radar Daily 8AM Run

on:
  schedule:
    # 00:00 UTC = 08:00 台北時間
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Fast Fonts
      run: |
        # 使用 -qq 減少日誌，安裝較輕小的文泉驛正黑體 (約 15MB)
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends fonts-wqy-zenhei

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        # 修正上一動的 genai 安裝與匯入問題
        pip install google-genai requests pandas yfinance plotly kaleido==0.2.1 pytz scipy gspread oauth2client feedparser praw

    - name: Run Market Radar
      env:
        LINE_ACCESS_TOKEN: ${{ secrets.LINE_ACCESS_TOKEN }}
        LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
        REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
      run: python daily_report.py
