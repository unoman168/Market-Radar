name: Daily Market Radar

on:
  schedule:
    - cron: '30 23 * * *' # 台灣時間每天早上 07:30 執行
  workflow_dispatch:      # 允許你在網頁上手動點擊 Run workflow 執行

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install all dependencies (包含 scipy 與 matplotlib)
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy yfinance plotly kaleido feedparser google-auth gspread google-genai praw scipy matplotlib

      - name: Run daily report script
        env:
          LINE_ACCESS_TOKEN: ${{ secrets.LINE_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
        run: |
          python daily_report.py
