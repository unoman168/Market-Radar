name: Market Radar Original Run

on:
  schedule:
    - cron: '30 0 * * *' # 台北時間 08:30
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install System Fonts
      run: |
        sudo apt-get update
        sudo apt-get install -y fonts-noto-cjk

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        # 關鍵在於加入 google-genai
        pip install google-genai requests pandas yfinance plotly kaleido==0.2.1 pytz scipy gspread oauth2client feedparser praw

    - name: Run Market Radar
      env:
        LINE_ACCESS_TOKEN: ${{ secrets.LINE_ACCESS_TOKEN }}
        LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
        REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
      run: python daily_report.py
