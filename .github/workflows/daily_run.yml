name: Daily Taiwan Stock Risk Report

on:
  schedule:
    # 伺服器時間為 UTC，台灣時間為 UTC+8
    # 設定 UTC 14:00 相當於台灣時間晚上 22:00
    # 1-5 代表台灣時間週一到週五執行
    - cron: '0 14 * * 1-5'
  workflow_dispatch: # 允許您手動點擊執行測試

permissions:
  contents: write

jobs:
  run-report:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        # 移除容易被擋的 BeautifulSoup，只需基本套件
        pip install requests yfinance pandas

    - name: Run Data Fetch and Send Line Message
      env:
        LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
      run: |
        python main.py

    - name: Commit and Push if Extremes Updated
      run: |
        git config --global user.name "MarketRadar-Bot"
        git config --global user.email "bot@marketradar.com"
        
        if [ -f extremes.json ]; then
          git add extremes.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Update historical extremes [skip ci]"
          git push
        else
          echo "今日未觸發歷史新高，無 extremes.json 需更新，略過 Commit 程序。"
        fi
